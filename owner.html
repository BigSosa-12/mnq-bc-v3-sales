<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EX1.1 Owner Analytics</title>
<style>
:root{--bg:#07090c;--cy:#2de2d0;--g:#2fd48a;--rd:#ff5b6b;--am:#f5b942;--tx:#e8edf2;--mu:#8b97a4;--gl:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 15% -10%,rgba(45,226,208,.14),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(47,212,138,.1),transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:18px 14px 60px}
.w{max-width:1040px;margin:0 auto}.glass{background:var(--gl);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}h1{margin:0;font-size:1.3rem}h1 span{color:var(--cy)}.sub{color:var(--mu);font-size:.8rem}
.rng{display:flex;gap:6px}.rng button,.back{font:inherit;font-size:.82rem;font-weight:700;color:var(--mu);background:var(--gl);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none}.rng button.on{color:#fff;border-color:rgba(45,226,208,.6);background:rgba(45,226,208,.16);box-shadow:0 0 14px rgba(45,226,208,.25)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:760px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
h2{margin:0 0 10px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.k{font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.d{font-size:.78rem;margin-top:2px}.up{color:var(--g)}.dn{color:var(--rd)}.fl{color:var(--mu)}
.m{margin:10px 0}.m .t{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:4px}.m .t b{font-variant-numeric:tabular-nums}.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,rgba(45,226,208,.7),#2fd48a);box-shadow:0 0 12px rgba(47,212,138,.7);transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative}.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:sh 2.6s infinite}@keyframes sh{to{transform:translateX(100%)}}
.bar.amb i{background:linear-gradient(90deg,#f5b942,#ff9f43);box-shadow:0 0 12px rgba(245,185,66,.6)}
svg text{fill:var(--mu);font:10px system-ui}.gauge{display:block;margin:0 auto;max-width:210px}
.feed{max-height:290px;overflow:auto;font-size:.84rem}.feed div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.feed span{color:var(--mu)}
.msg{text-align:center;padding:34px 18px}.msg h3{margin:0 0 8px}.msg code{display:block;text-align:left;margin:10px auto;max-width:560px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid var(--bd);color:var(--cy);font-size:.8rem;overflow:auto;white-space:pre}
.note{color:var(--mu);font-size:.75rem;margin-top:14px}.hide{display:none}
</style></head><body><div class="w">
<header><div><h1>EX1.1 <span>Owner Analytics</span></h1><div class="sub" id="sub">Anonymous counts only. No personal data.</div></div><div class="rng" id="rng"><button data-d="1">Today</button><button data-d="7" class="on">7d</button><button data-d="30">30d</button><button data-d="90">90d</button><a class="back" href="./">Site</a></div></header>
<div id="app"><div class="glass msg">Loading…</div></div>
<p class="note">Clicks on Buy buttons are purchase intent, not sales. Your Stripe dashboard is the source of truth for actual payments. Your own visits are excluded from this device automatically.</p>
</div>
<script>
var API='/*EXAPI*/';try{localStorage.setItem('noTrack','1')}catch(e){}
var D=7,app=document.getElementById('app');
var LBL={view:'Visit',heart:'Heard Heart',learn:'Opened Learn tab',lesson:'Started free lesson',ask:'Asked Heart a question',buy_ex:'Clicked Buy EX1.1',buy_v3:'Clicked Buy V3'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(o,t){var r=(o||[]).filter(function(x){return x.t===t})[0];return r?r.n:0}
function pct(a,b){return b?Math.round(a/b*1000)/10:0}
function delta(c,p){if(!p&&!c)return '<span class="fl">no data yet</span>';if(!p)return '<span class="up">new</span>';var d=Math.round((c-p)/p*100);return '<span class="'+(d>=0?'up':'dn')+'">'+(d>=0?'▲ ':'▼ ')+Math.abs(d)+'% vs previous</span>'}
function tile(l,v,c,p){return '<div class="glass c3"><h2>'+l+'</h2><div class="k" data-n="'+v+'">0</div><div class="d">'+delta(c,p)+'</div></div>'}
function meter(l,v,tot,amb){var p=tot?Math.min(100,v/tot*100):0;return '<div class="m"><div class="t"><span>'+l+'</span><b>'+v+' <span class="fl">('+Math.round(p)+'%)</span></b></div><div class="bar'+(amb?' amb':'')+'"><i data-w="'+p+'"></i></div></div>'}
function gauge(p,lbl){var r=70,c=Math.PI*r,o=c*(1-Math.min(p,100)/100);return '<svg class="gauge" viewBox="0 0 180 110"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#2de2d0"/><stop offset="1" stop-color="#2fd48a"/></linearGradient></defs><path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14" stroke-linecap="round"/><path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" data-o="'+o+'" style="filter:drop-shadow(0 0 8px rgba(47,212,138,.8));transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/><text x="90" y="82" text-anchor="middle" style="fill:#fff;font:800 26px system-ui">'+p+'%</text><text x="90" y="103" text-anchor="middle">'+lbl+'</text></svg>'}
function chart(days,vals,vals2){var W=620,H=180,pl=30,pb=20,n=days.length,mx=Math.max(4,Math.max.apply(0,vals.concat(vals2)))*1.1,sx=function(i){return pl+(n<2?(W-pl)/2:i*(W-pl-22)/(n-1))},sy=function(v){return H-pb-v/mx*(H-pb-10)};
function path(a){return a.map(function(v,i){return(i?'L':'M')+sx(i).toFixed(1)+' '+sy(v).toFixed(1)}).join(' ')}
var g='';for(var i=0;i<=3;i++){var y=sy(mx*i/3);g+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="rgba(255,255,255,.06)"/><text x="0" y="'+(y+3)+'">'+Math.round(mx*i/3)+'</text>'}
var step=Math.ceil(n/7),xl='';days.forEach(function(d,i){if(i%step===0)xl+='<text x="'+sx(i)+'" y="'+(H-4)+'" text-anchor="middle">'+d.slice(5)+'</text>'});
var area=path(vals)+' L'+sx(n-1)+' '+(H-pb)+' L'+sx(0)+' '+(H-pb)+' Z';
return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fd48a" stop-opacity=".45"/><stop offset="1" stop-color="#2fd48a" stop-opacity="0"/></linearGradient></defs>'+g+xl+'<path d="'+area+'" fill="url(#ar)"/><path d="'+path(vals)+'" fill="none" stroke="#2fd48a" stroke-width="2.5" style="filter:drop-shadow(0 0 6px rgba(47,212,138,.8))"/><path d="'+path(vals2)+'" fill="none" stroke="#f5b942" stroke-width="2" stroke-dasharray="4 3"/>'+vals.map(function(v,i){return'<circle cx="'+sx(i)+'" cy="'+sy(v)+'" r="3" fill="#2fd48a"/>'}).join('')+'</svg><div class="sub" style="display:flex;gap:14px"><span style="color:#2fd48a">● Visitors</span><span style="color:#f5b942">┅ Buy clicks</span></div>'}
function hours(h){var a=[];for(var i=0;i<24;i++)a.push(0);(h||[]).forEach(function(x){a[x.hr]=x.n});var mx=Math.max.apply(0,a)||1;return '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px">'+a.map(function(v,i){var o=v?(.18+v/mx*.82):.06;return '<div title="'+i+':00 UTC — '+v+'" style="height:34px;border-radius:5px;background:rgba(47,212,138,'+o.toFixed(2)+');box-shadow:'+(v/mx>.6?'0 0 8px rgba(47,212,138,.7)':'none')+'"></div>'}).join('')+'</div><div class="sub" style="display:flex;justify-content:space-between"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>11p</span></div><div class="sub">Hours shown in UTC (Detroit is UTC-5).</div>'}
function ago(ts){var s=Math.round((Date.now()-ts)/1000);return s<60?s+'s ago':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'}
function render(d){var tt=d.totals,pv=d.previous.totals,vis=d.visitors||0,fn=function(t){var r=(d.funnel||[]).filter(function(x){return x.t===t})[0];return r?r.n:0};
var buys=fn('buy_ex')+fn('buy_v3'),views=T(tt,'view'),pbuys=T(pv,'buy_ex')+T(pv,'buy_v3');
var conv=pct(buys,vis||fn('view')),days=[],i;var from=new Date(d.from+'T00:00:00Z');for(i=0;i<d.days;i++){days.push(new Date(from.getTime()+i*864e5).toISOString().slice(0,10))}
var dv={},db={};(d.uniques||[]).forEach(function(x){dv[x.day]=x.n});(d.series||[]).forEach(function(x){if(x.t==='buy_ex'||x.t==='buy_v3')db[x.day]=(db[x.day]||0)+x.n});
var v1=days.map(function(x){return dv[x]||0}),v2=days.map(function(x){return db[x]||0});
var base=vis||fn('view')||1;
var src=(d.sources||[]),stot=src.reduce(function(a,x){return a+x.n},0)||1,dev=(d.devices||[]),dtot=dev.reduce(function(a,x){return a+x.n},0)||1;
var mob=(dev.filter(function(x){return x.dev==='mobile'})[0]||{n:0}).n;
var h='<div class="grid">'+tile('Visitors',vis,vis,d.previous.visitors)+tile('Page views',views,views,T(pv,'view'))+tile('Buy clicks',buys,buys,pbuys)+tile('Questions asked',T(tt,'ask'),T(tt,'ask'),T(pv,'ask'))
+'<div class="glass c8"><h2>Visitors &amp; buy clicks per day</h2>'+chart(days,v1,v2)+'</div>'
+'<div class="glass c4"><h2>Visitor → buy click</h2>'+gauge(conv,'conversion rate')+'<div class="sub" style="text-align:center;margin-top:6px">'+buys+' of '+(vis||fn('view'))+' visitors clicked Buy</div></div>'
+'<div class="glass c6"><h2>Visitor journey (unique people)</h2>'+meter('Visited',fn('view'),base)+meter('Heard Heart speak',fn('heart'),base)+meter('Opened Learn to Trade',fn('learn'),base)+meter('Started free lesson',fn('lesson'),base)+meter('Asked Heart a question',fn('ask'),base)+meter('Clicked Buy EX1.1',fn('buy_ex'),base,1)+meter('Clicked Buy V3',fn('buy_v3'),base,1)+'</div>'
+'<div class="glass c6"><h2>Where visitors come from</h2>'+(src.length?src.map(function(x){return meter(x.src[0].toUpperCase()+x.src.slice(1),x.n,stot)}).join(''):'<div class="sub">No visits yet</div>')+'<h2 style="margin-top:16px">Devices</h2>'+meter('Mobile',mob,dtot)+meter('Desktop',dtot-mob,dtot)+'<div class="sub">Tip: add <b>?src=facebook</b> to links you post so the source is exact.</div></div>'
+'<div class="glass c7"><h2>Busiest hours</h2>'+hours(d.hourly)+'</div>'
+'<div class="glass c5"><h2>Live activity</h2><div class="feed">'+((d.recent||[]).length?d.recent.map(function(x){return '<div><b>'+esc(LBL[x.t]||x.t)+'</b><span>'+esc(x.src)+' · '+esc(x.dev)+' · '+ago(x.ts)+'</span></div>'}).join(''):'<div><span>Nothing yet</span></div>')+'</div></div></div>';
app.innerHTML=h;
app.querySelectorAll('[data-n]').forEach(function(e){var n=+e.dataset.n,t0=null;(function f(ts){if(t0===null)t0=ts;var p=Math.min((ts-t0)/800,1);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(performance.now())});
setTimeout(function(){app.querySelectorAll('[data-w]').forEach(function(e){e.style.width=e.dataset.w+'%'});app.querySelectorAll('[data-o]').forEach(function(e){e.style.strokeDashoffset=e.dataset.o})},60);
document.getElementById('sub').textContent='Anonymous counts only. Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function setup(){app.innerHTML='<div class="glass msg"><h3>Analytics server not connected yet</h3><div class="sub">The page is ready. It just needs the free collector deployed once. Steps are in analytics-worker/README.md in the repo.</div></div>'}
function load(){if(!API||API.indexOf('EXAPI')>-1){setup();return}fetch(API+'/stats?days='+D,{credentials:'omit'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){app.innerHTML='<div class="glass msg"><h3>Could not load the numbers</h3><div class="sub">Check that the analytics server is running, then refresh.</div></div>'})}
document.getElementById('rng').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;D=+b.dataset.d;this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});load()});
load();setInterval(function(){if(document.visibilityState==='visible')load()},30000);
</script></body></html>
