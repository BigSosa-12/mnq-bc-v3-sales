name = "heart-teacher"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOW_ORIGIN = "https://bigsosa-12.github.io"
MODEL = "claude-haiku-5-5"
WEB_SEARCH = "1"
MEMBER_DAILY = "40"
GLOBAL_DAILY = "500"

